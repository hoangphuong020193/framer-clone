<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello it's Phanne</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
    #__framer-badge-container {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <iframe
    src="https://mighty-clarity-241350.framer.app"
    title="Hello it's Phanne"
    allow="fullscreen"
    loading="lazy"
  ></iframe>
  <script>
  (function() {
    const hideBadge = () => {
      const badge = document.querySelector('#__framer-badge-container');
      if (badge) {
        badge.style.setProperty('display', 'none', 'important');
        // Optional: Remove it entirely from the DOM
        badge.remove();
      }
    };

    // Run every 100ms for the first 3 seconds to catch it
    const interval = setInterval(hideBadge, 100);
    setTimeout(() => clearInterval(interval), 3000);

    // Also run on any DOM changes
    const observer = new MutationObserver(hideBadge);
    observer.observe(document.body, { childList: true, subtree: true });
  })();
</script>
</body>
</html>
